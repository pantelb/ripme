name: Flutter Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v1.0.0. Required for manual releases.'
        required: true
        type: string
      build_ref:
        description: 'Git ref to build. Use Flutter for the Flutter migration branch.'
        required: false
        default: 'Flutter'
        type: string
      draft:
        description: 'Create the GitHub Release as a draft.'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub Release as a prerelease.'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish, for example v1.0.0.'
        required: true
        type: string
      build_ref:
        description: 'Git ref to build.'
        required: false
        default: 'Flutter'
        type: string
      draft:
        description: 'Create the GitHub Release as a draft.'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub Release as a prerelease.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: flutter-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: '17'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.build_ref || github.ref }}

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-desktop:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: ripme-linux-x64
            platform_suffix: linux-x64
            build_path: build/linux/x64/release/bundle
            archive_type: tar.gz
          - os: windows-2022
            target: windows
            artifact: ripme-windows-x64
            platform_suffix: windows-x64
            build_path: build/windows/x64/runner/Release
            archive_type: zip
          - os: macos-latest
            target: macos
            artifact: ripme-macos-universal
            platform_suffix: macos-universal
            build_path: build/macos/Build/Products/Release/RipMe.app
            archive_type: zip

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable ${{ matrix.target }} desktop
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Disable Swift Package Manager for macOS
        if: matrix.target == 'macos'
        run: flutter config --no-enable-swift-package-manager

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must contain a version such as v1.2.3: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RIPME_VERSION=$version" >> "$GITHUB_ENV"
          echo "RIPME_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }} release
        shell: bash
        run: >-
          flutter build ${{ matrix.target }} --release
          --build-name "$RIPME_VERSION"
          --build-number "$RIPME_BUILD_NUMBER"
          --dart-define "RIPME_VERSION=$RIPME_VERSION"
          --dart-define "RIPME_BUILD_NUMBER=$RIPME_BUILD_NUMBER"

      - name: Verify Linux bundle
        if: matrix.target == 'linux'
        run: bash tool/verify_linux_bundle.sh

      - name: Package ${{ matrix.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive_name="ripme-${RIPME_VERSION}-${{ matrix.platform_suffix }}"

          if [ "${{ matrix.archive_type }}" = "tar.gz" ]; then
            tar -C "${{ matrix.build_path }}" -czf "dist/${archive_name}.tar.gz" .
          elif [ "${{ matrix.target }}" = "macos" ]; then
            ditto -c -k --keepParent "${{ matrix.build_path }}" "dist/${archive_name}.zip"
          else
            (cd "${{ matrix.build_path }}" && 7z a "$GITHUB_WORKSPACE/dist/${archive_name}.zip" .)
          fi

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  build-android:
    name: Build Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must contain a version such as v1.2.3: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RIPME_VERSION=$version" >> "$GITHUB_ENV"
          echo "RIPME_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build Android APK
        run: >-
          flutter build apk --release
          --build-name "$RIPME_VERSION"
          --build-number "$RIPME_BUILD_NUMBER"
          --dart-define "RIPME_VERSION=$RIPME_VERSION"
          --dart-define "RIPME_BUILD_NUMBER=$RIPME_BUILD_NUMBER"

      - name: Build Android App Bundle
        run: >-
          flutter build appbundle --release
          --build-name "$RIPME_VERSION"
          --build-number "$RIPME_BUILD_NUMBER"
          --dart-define "RIPME_VERSION=$RIPME_VERSION"
          --dart-define "RIPME_BUILD_NUMBER=$RIPME_BUILD_NUMBER"

      - name: Package Android artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ripme-${RIPME_VERSION}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/ripme-${RIPME_VERSION}-android.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ripme-android
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - build-desktop
      - build-android
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release artifacts
        run: ls -la release-artifacts

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_REF }}
          name: RipMe ${{ env.RELEASE_TAG }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
