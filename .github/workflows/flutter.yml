name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Linux build dependencies
      run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libnotify-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

    - name: Install dependencies
      run: flutter pub get

    - name: Fetch Java source baseline
      run: git fetch origin main:refs/remotes/origin/main --depth=1

    - name: Verify legacy ripper catalog
      run: dart run tool/check_legacy_ripper_catalog.dart

    - name: Verify Java config key coverage
      run: dart run tool/check_java_config_keys.dart

    - name: Verify Java localization key coverage
      run: dart run tool/check_java_localization_keys.dart

    - name: Verify Java icon resources
      run: dart run tool/check_java_icon_resources.dart

    - name: Verify Java completion sound
      run: dart run tool/check_java_sound_resource.dart

    - name: Verify Java resource packaging
      run: dart run tool/check_java_resource_packaging.dart

    - name: Verify version metadata
      run: dart run tool/check_version_metadata.dart

    - name: Verify release artifact naming
      run: dart run tool/check_release_artifact_naming.dart

    - name: Verify Android storage policy
      run: dart run tool/check_android_storage_policy.dart

    - name: Verify macOS platform policy
      run: dart run tool/check_macos_platform.dart

    - name: Verify Linux packaging policy
      run: dart run tool/check_linux_packaging.dart

    - name: Verify Windows packaging policy
      run: dart run tool/check_windows_packaging.dart

    - name: Verify Java test class coverage
      run: dart run tool/check_java_test_coverage.dart

    - name: Analyze
      run: flutter analyze

    - name: Run tests
      timeout-minutes: 30
      run: flutter test --reporter expanded --concurrency=1

  build-desktop:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: ripme-linux
            path: build/linux/x64/release/bundle
          - os: windows-2022
            target: windows
            artifact: ripme-windows
            path: build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            artifact: ripme-macos
            path: build/macos/Build/Products/Release/RipMe.app

    steps:
    - uses: actions/checkout@v6

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Disable Swift Package Manager for macOS
      if: matrix.target == 'macos'
      run: flutter config --no-enable-swift-package-manager

    - name: Install Linux build dependencies
      if: matrix.target == 'linux'
      run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libnotify-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

    - name: Install dependencies
      run: flutter pub get

    - name: Build ${{ matrix.target }}
      run: flutter build ${{ matrix.target }} --release

    - name: Verify Linux bundle
      if: matrix.target == 'linux'
      run: bash tool/verify_linux_bundle.sh

    - name: Verify Windows bundle
      if: matrix.target == 'windows'
      run: >-
        pwsh -File tool/verify_windows_bundle.ps1 -Bundle
        "${{ matrix.path }}"

    - name: Package ${{ matrix.artifact }}
      shell: bash
      run: |
        mkdir -p dist
        if [ "${{ matrix.target }}" = "macos" ]; then
          ditto -c -k --keepParent "${{ matrix.path }}" "dist/${{ matrix.artifact }}.zip"
        elif [ "${{ matrix.target }}" = "windows" ]; then
          (cd "${{ matrix.path }}" && 7z a "$GITHUB_WORKSPACE/dist/${{ matrix.artifact }}.zip" .)
        else
          tar -C "${{ matrix.path }}" -czf "dist/${{ matrix.artifact }}.tar.gz" .
        fi

    - name: Upload ${{ matrix.artifact }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        path: dist/*

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Build Android APK
      run: flutter build apk --release

    - name: Upload Android APK
      uses: actions/upload-artifact@v7
      with:
        name: ripme-android-apk
        path: build/app/outputs/flutter-apk/app-release.apk
